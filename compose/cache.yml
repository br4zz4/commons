services:
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--port", "${CACHE_PORT:?set CACHE_PORT in .env}"]
    environment:
      REDISCLI_PORT: ${CACHE_PORT}
    ports:
      - "${CACHE_PORT}:${CACHE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${REDISCLI_PORT} ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
