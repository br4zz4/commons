services:
  mail:
    image: axllent/mailpit:v1
    environment:
      MP_UI_BIND_ADDR: 0.0.0.0:${MAIL_PORT:?set MAIL_PORT in .env}
      MP_SMTP_BIND_ADDR: 0.0.0.0:${SMTP_PORT:?set SMTP_PORT in .env}
    ports:
      - "${MAIL_PORT}:${MAIL_PORT}"
      - "${SMTP_PORT}:${SMTP_PORT}"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
